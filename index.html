<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subilo Vos</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon/192.png" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="stylesheet" href="/style.css">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .catch(err => console.error('Service Worker error:', err));
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>Subir video</h2>
    <input type="file" id="videoInput" accept="video/*" />
    <label for="startDate">Inicio:</label>
    <input type="date" id="startDateDate" required step="60">
    <input type="time" id="startDateTime" required step="60">

    <label for="endDate">Fin:</label>
    <input type="date" id="endDateDate" required step="60">
    <input type="time" id="endDateTime" required step="60">

    <button id="uploadBtn">Subir</button>

    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <p id="status"></p>

    <h3>Videos en la nube</h3>
    <div id="videoList"></div>
    <button id="deleteBtn">🗑️ Borrar seleccionados</button>
    <p id="deleteStatus"></p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
