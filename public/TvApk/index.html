<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TvApk</title>
  <style>
    body {
      margin: 0;
      background: #000 url('/tv/videos/backup/SDO.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    #videoPlayer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .flecha {
      position: absolute;
      width: 30px;
      height: auto;
      opacity: 0.6;
      animation: mover 3s linear infinite;
      z-index: 1;
    }

    .flecha.izquierda {
      left: 10px;
      top: 0;
      bottom: 0;
      margin: auto;
      animation-direction: normal;
    }

    .flecha.derecha {
      right: 10px;
      top: 0;
      bottom: 0;
      margin: auto;
      animation-direction: reverse;
    }

    @keyframes mover {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.2; }
    }
  </style>
</head>
<body>
  <!-- Flechas laterales -->
  <img src="/tv/videos/backup/circunnaranja.png" class="flecha izquierda" alt="←">
  <img src="/tv/videos/backup/circunnaranja.png" class="flecha derecha" alt="→">

  <!-- Video -->
  <video id="videoPlayer" playsinline autoplay muted></video>

  <script src="main.js"></script>
</body>
</html>
