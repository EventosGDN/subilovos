<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TvApk</title>
  <style>
    body {
      margin: 0;
      background: #000 url('/tv/videos/backup/SDO.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    #videoPlayer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    .flechas-lado {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      pointer-events: none;
      z-index: 0;
    }

    .flechas-lado img {
      width: 100%;
      opacity: 0.6;
      animation: subirBajar 2s infinite ease-in-out;
    }

    .flechas-lado.izquierda {
      left: 10px;
    }

    .flechas-lado.derecha {
      right: 10px;
      transform: scaleY(-1); /* Flechas bajando */
    }

    @keyframes subirBajar {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-10px); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Columnas de flechas -->
  <div class="flechas-lado izquierda">
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
  </div>

  <div class="flechas-lado derecha">
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
    <img src="/tv/videos/backup/circunblanco.png" />
  </div>

  <!-- Reproductor -->
  <video id="videoPlayer" playsinline autoplay muted></video>

  <script src="main.js"></script>
</body>
</html>
