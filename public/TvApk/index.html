<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubiloVos TV Apk</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #backgroundImage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #backgroundImage img {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      background-color: transparent;
      display: none;
    }

    #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.5rem;
      z-index: 3;
    }

    .column {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2em;
      font-size: 2em;
      line-height: 1.5em;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      z-index: 1;
      pointer-events: none;
    }

    .column.left {
      left: 0.5em;
      animation: moverFlechasArriba 2s linear infinite;
    }

    .column.right {
      right: 0.5em;
      transform: scaleY(-1);
      animation: moverFlechasAbajo 2s linear infinite;
    }

    .column span {
      display: block;
      text-align: center;
      opacity: 0.5;
    }

    @keyframes moverFlechasArriba {
      0% { transform: translateY(0); }
      100% { transform: translateY(-1.5em); }
    }

    @keyframes moverFlechasAbajo {
      0% { transform: translateY(0) scaleY(-1); }
      100% { transform: translateY(1.5em) scaleY(-1); }
    }
  </style>
</head>
<body>
  <!-- Imagen de fondo como capa real -->
  <div id="backgroundImage">
    <img src="/tv/videos/backup/SDO.png" alt="Fondo" />
  </div>

  <!-- Columnas animadas como en cuenta regresiva -->
  <div class="column left">
    <span>^</span><span>^</span><span>^</span><span>^</span><span>^</span><span>^</span>
  </div>
  <div class="column right">
    <span>^</span><span>^</span><span>^</span><span>^</span><span>^</span><span>^</span>
  </div>

  <!-- Video -->
  <video id="videoPlayer" muted autoplay playsinline preload="auto"></video>

  <!-- Fallback -->
  <div id="fallback" style="display: none;">No se pudieron cargar videos programados.</div>

  <!-- Script -->
  <script src="main.js"></script>
</body>
</html>
