<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubiloVos TV</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }

    #backgroundImage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      background-color: transparent;
    }

    #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.5rem;
      z-index: 3;
      display: none;
    }

    .accent {
      position: absolute;
      width: 40px;
      height: 40px;
      background-image: url("/tv/videos/backup/circunblanco.png");
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 0.5;
      z-index: 4;
    }

    .left-accent {
      left: 10px;
      animation: subir 6s linear infinite;
    }

    .right-accent {
      right: 10px;
      animation: bajar 6s linear infinite;
    }

    @keyframes subir {
      0% { top: 100%; }
      100% { top: -40px; }
    }

    @keyframes bajar {
      0% { top: -40px; }
      100% { top: 100%; }
    }
  </style>
</head>
<body>
  <img id="backgroundImage" src="/tv/videos/backup/SDO.png" alt="Fondo" />
  <video id="videoPlayer" muted autoplay playsinline preload="auto"></video>
  <div id="fallback">No se pudieron cargar videos programados.</div>

  <!-- Acentos circunflejos -->
  <div class="accent left-accent"></div>
  <div class="accent right-accent"></div>

  <script src="main.js"></script>
</body>
</html>
