<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubiloVos AppDroid</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #backgroundImage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

   .acento-lateral {
  position: absolute;
  width: 30px;
  height: 100%;
  background-image: url('cintillo-acentos.png');
  background-repeat: repeat-y;
  background-size: 100% auto;
  background-position: center top;
  opacity: 0.8;
  z-index: 1;
  animation: moverVertical 10s linear infinite;
  pointer-events: none;
}

.acento-lateral.izquierda {
  left: 0;
}

.acento-lateral.derecha {
  right: 0;
  transform: scaleY(-1);
}

@keyframes moverVertical {
  0% { background-position-y: 100%; }
  100% { background-position-y: 0%; }
}



    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background-color: black;
      display: none;
    }

    #fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.5rem;
      z-index: 3;
    }
  </style>
</head>
<body>
  <img id="backgroundImage" src="" />
<script>
  document.getElementById('backgroundImage').src = location.origin + '/tv/videos/backup/SDO.png'
</script>

  <div class="acento-lateral izquierda"></div>
<div class="acento-lateral derecha"></div>
  <video id="videoPlayer" muted autoplay playsinline preload="auto"></video>
  <div id="fallback" style="display: none;">No se pudieron cargar videos programados.</div>
  <script src="main.js"></script>
</body>
</html>
